<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Little Mood Tracker</title>

        <!-- CSS code -->
         <style>
            

            *{
                box-sizing: border-box;
            }
            body{
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family: Arial, Helvetica, sans-serif;
                color: #fff;
                background: linear-gradient(135deg, #11152f, #34264f);
                transition: background 0.5s;
                overflow: hidden;
            }

            .stars{
                display: flex;
                justify-content: space-around;
                width: 40%;
                pointer-events: none;
                color: #e7d8ff;
                font-size: 22px;
                animation: float 5s ease-in-out infinite alternate;
            }

            @keyframes float{
                from{transform:translateY(10px)}
                to{transform:translateY(-15px)}
            }

            .card{
                position: relative;
                width: min(90%, 420px);
                padding: 36px 24px;
                text-align: center;
                border: 1px solid #ffffff25;
                border-radius:28px;
                background-color: #ffffff10;
                backdrop-filter: blur(12px);
                box-shadow: 0 20px 60px #0003;
            }

            .small{
                color: #d4c2f4;
                letter-spacing: 3px;
                font-size: 11px;
                text-transform: uppercase;
            }

            h1{
                font-size: 30px;
                line-height: 1.25;
                margin: 20px 0 10px;
            }

            p{
                color: #d8d2e8;
                line-height: 1.6;
            }

            .moods{
                display: grid;
                grid-template-columns: repeat(2,1fr);
                gap: 12px;
                margin: 26px 0;
            }

            button{
                border: 1px solid rgba(255, 255, 255, 0.25);
                border-radius: 16px;
                padding: 16px 8px;
                color: white;
                background: #ffffff12;
                font-size: 15px;
                cursor: pointer;
                transition: 0.25s;
            }

            button:hover, button.active{
                background: #d9c4ff35;
                border-color: #d9c4ff;
                transform: translateY(-3px);
            }

            #message{
                min-height: 50px;
                color: #f2dfff;
                font-size: 14px;
            }

            footer{
                margin-top: 20px;
                font-size: 11px;
                color: #bcb0d4;
            }

         </style>

    </head>


    <body>
        <div class="stars">
            <h2>✦</h2>
            <h2>✦</h2>
            <h2>✦</h2>
            <h2>✦</h2>
        </div>

        <main class="card">
            
            <div class="small">✦ a little check-in ✦</div>
            <h1>How are you<br>feeling today?</h1>
            <p>Take a breath. Check in with yourself.</p>
            <div class="moods">
                <button data-mood="happy">☀Happy</button>
                <button data-mood="calm">☁Calm</button>
                <button data-mood="tired">🌙Tired</button>
                <button data-mood="loved">❤️Loved</button>
            </div>

            <div id="message" aria-live="polite">
                Choose the mood that feels like you.
            </div>

            <footer>
                made with little bit of love ✦
            </footer>

        </main>

        <script>
            const moods = { 
                happy:{background:"linear-gradient(135deg, #33234e, #8b577c)", message: "Keep this little sunshine with you ☀"},
                calm:{background:"linear-gradient(135deg, #152d43, #507f91)", message:"You are allowed to take things slowly ☁"},
                tired:{background:"linear-gradient(135deg, #11152f, #343c65)", message:"Rest is productive, too. Be gentle 🌙"},
                loved:{background:"linear-gradient(135deg, #49203f, #a85f86)", message:"You deserve the love you give ❤️"}
        }

        const buttons = document.querySelectorAll("[data-mood]");
        const message = document.querySelector("#message");
        buttons.forEach(button =>{
            button.addEventListener("click", ()=>{
                const mood = moods[button.dataset.mood];
                document.body.style.background = mood.background;
                message.textContent = mood.message;
                buttons.forEach(item => {
                    item.classList.remove("active");
                });
                button.classList.add("active");
            });
        }) ;
        </script>
        
    </body>

</html>
